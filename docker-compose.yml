services:
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  customer-db:
    image: postgres:15-alpine
    container_name: customer-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: customer_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: order_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-db:
    image: mongo:6.0
    container_name: product-db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  shipment-db:
    image: mongo:6.0
    container_name: shipment-db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-gateway:
    image: redis:7-alpine
    container_name: redis-gateway
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:password123@auth-db:5432/auth_db"
      JWT_SECRET: "super_secret_ecommerce_jwt_key_2026"
      JWT_EXPIRES_IN: "3600"
      GRPC_PORT: "50051"
    ports:
      - "50051:50051"
    depends_on:
      auth-db:
        condition: service_healthy

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:password123@customer-db:5432/customer_db"
      GRPC_PORT: "50052"
    ports:
      - "50052:50052"
    depends_on:
      customer-db:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    restart: unless-stopped
    environment:
      MONGO_URI: "mongodb://product-db:27017/product_db"
      GRPC_PORT: "50053"
    ports:
      - "50053:50053"
    depends_on:
      product-db:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:password123@order-db:5432/order_db"
      KAFKA_BROKERS: "kafka:9092"
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      CUSTOMER_SERVICE_URL: "customer-service:50052"
      PRODUCT_SERVICE_URL: "product-service:50053"
      SHIPMENT_SERVICE_URL: "shipment-service:50055"
      GRPC_PORT: "50054"
    ports:
      - "50054:50054"
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started

  shipment-service:
    build:
      context: .
      dockerfile: services/shipment-service/Dockerfile
    container_name: shipment-service
    restart: unless-stopped
    environment:
      MONGO_URI: "mongodb://shipment-db:27017/shipment_db"
      KAFKA_BROKERS: "kafka:9092"
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      GRPC_PORT: "50055"
    ports:
      - "50055:50055"
    depends_on:
      shipment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      PORT: "3000"
      REDIS_URL: "redis://redis-gateway:6379"
      AUTH_SERVICE_URL: "auth-service:50051"
      CUSTOMER_SERVICE_URL: "customer-service:50052"
      PRODUCT_SERVICE_URL: "product-service:50053"
      ORDER_SERVICE_URL: "order-service:50054"
      SHIPMENT_SERVICE_URL: "shipment-service:50055"
      RATE_LIMIT_WINDOW_SEC: "60"
      RATE_LIMIT_MAX_REQUESTS: "100"
    ports:
      - "3000:3000"
    depends_on:
      redis-gateway:
        condition: service_healthy
      auth-service:
        condition: service_started
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      shipment-service:
        condition: service_started
